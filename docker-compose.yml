services:
  api:
    build:
      context: ..
      dockerfile: mealplanner-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://mealplanner:mealplanner@db:5432/mealplanner
      JWT_SECRET: development-only-secret-change-me
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mealplanner
      POSTGRES_PASSWORD: mealplanner
      POSTGRES_DB: mealplanner
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealplanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
