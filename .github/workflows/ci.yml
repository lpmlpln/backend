name: API

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mealplanner
          POSTGRES_PASSWORD: mealplanner
          POSTGRES_DB: mealplanner_test
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Configure access to the core package
        if: ${{ secrets.CORE_REPO_TOKEN != '' }}
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.CORE_REPO_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"
      - run: swift build
      - run: swift test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: mealplanner
          POSTGRES_PASSWORD: mealplanner
          POSTGRES_DB: mealplanner_test
